<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A crooked falling-block arcade game where gravity has opinions.">
  <title>WRONG NICKY — CR34TE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="game-shell">
    <header class="game-header">
      <a class="wordmark" href="/" aria-label="CR34TE home">CR34TE<span>IT</span></a>
      <p class="eyebrow">An arcade incident</p>
    </header>
    <section class="game-card" aria-labelledby="game-title">
      <div class="game-meta">
        <div><p class="label">Damage</p><output id="score" class="score">0000</output></div>
        <div class="title-wrap"><h1 id="game-title">WRONG<br>NICKY</h1><p id="status" class="status" aria-live="polite">The blocks are not on your side.</p></div>
        <div class="right-meta"><p class="label">Chaos</p><output id="level" class="score">01</output></div>
      </div>
      <div class="arena">
        <canvas id="game" width="360" height="600" aria-label="Falling block game board" role="img"></canvas>
        <aside class="side-panel"><p class="label">Next mistake</p><canvas id="next" width="120" height="120" aria-label="Next block"></canvas><p class="label">Rules of disorder</p><p id="rule">Gravity is a suggestion.</p><div class="mini-stat"><span>Lines</span><output id="lines">0</output></div><div class="mini-stat"><span>Twists</span><output id="twists">0</output></div></aside>
        <button id="play" class="play-button" type="button">BREAK REALITY</button>
      </div>
      <div class="controls" aria-label="Game controls"><button type="button" data-action="left" aria-label="Move left">←</button><button type="button" data-action="rotate" aria-label="Rotate">↻</button><button type="button" data-action="right" aria-label="Move right">→</button><button type="button" data-action="flip" aria-label="Flip gravity">⇅</button><button type="button" data-action="down" aria-label="Soft drop">↓</button><button type="button" data-action="drop" aria-label="Hard drop">DROP</button></div>
      <p class="hint">Arrows move · ↑ / X rotate · Z reverse · Space drop · P pause</p>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
