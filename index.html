<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MINESWEEPER FROM HELL</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#090711;color:#f5eaff;font:14px monospace}main{height:100dvh;width:100%;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(ellipse at top,#472047,#090711 70%)}h1{font:bold clamp(24px,6vw,42px)/.95 system-ui;text-align:center;margin:0;text-shadow:3px 2px #ff4fb3,-2px -1px #4deeea}.sub{color:#4deeea;font-size:10px;text-align:center;letter-spacing:1px}.game{width:min(100%,520px);min-height:0;border:1px solid #76518b;background:#120c1c;padding:clamp(6px,2vw,12px);display:flex;flex-direction:column;gap:8px;box-shadow:5px 5px #35153b}.stats{display:flex;justify-content:space-between;gap:5px;font-size:clamp(8px,2vw,11px);color:#d7c4e4}.stats strong{display:block;color:#d9ff43;font-size:clamp(15px,3vw,21px)}#message{min-height:2.4em;display:grid;place-items:center;text-align:center;color:#ff72c2;font-size:clamp(9px,2.4vw,12px)}#board{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));gap:3px;width:min(100%,min(54dvh,410px));aspect-ratio:1;align-self:center}.tile{min-width:0;min-height:0;padding:0;border:1px solid #76558b;background:linear-gradient(145deg,#52365f,#291b38);color:#4deeea;font:bold clamp(12px,3.5vw,20px) monospace;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}.tile:hover:not(.open){background:#70417d}.tile.open{background:#0b0912;border-color:#30233b}.tile.mine{background:#871448;color:white}.tile.flag{color:#d9ff43}.tile.n1{color:#4deeea}.tile.n2{color:#8aff80}.tile.n3{color:#ff4fb3}.tile.n4{color:#bca4ff}.tile.n5,.tile.n6,.tile.n7,.tile.n8{color:#ffe66d}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:6px}.controls button{padding:9px 10px;background:#21172b;border:1px solid #80638e;color:#d9ff43;font:bold 10px monospace;cursor:pointer}.controls button[aria-pressed=true]{background:#d9ff43;color:#100b19}footer{text-align:center;font-size:9px;line-height:1.5;color:#b7a3c7;max-width:520px}@media(max-height:560px){main{gap:4px;padding:3px}h1{font-size:clamp(19px,5vh,28px)}.sub,footer{display:none}.game{padding:4px;gap:3px}#board{width:min(100%,47dvh,360px);gap:2px}.controls{gap:3px}.controls button{padding:5px 7px}#message{min-height:1.5em}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>MINESWEEPER<br>FROM HELL</h1>
<div class="sub">THE UNIVERSE HAS MISFILED YOUR EXISTENCE</div>
<section class="game">
<div class="stats"><div>BOMBS<strong id="bombs">010</strong></div><div style="text-align:center">COSMIC DEBT<strong id="score">0000</strong></div><div style="text-align:right">REALITY<strong id="time">0 SEC</strong></div></div>
<div id="message" aria-live="polite">Your application to exist is pending.</div>
<div id="board" role="group" aria-label="Minesweeper board"></div>
<div class="controls"><button id="flagmode" aria-pressed="false">FLAG MODE: OFF</button><button id="restart">NEW UNIVERSE ↻</button><button id="weird">SUMMON NONSENSE</button></div>
</section>
<footer>CLICK TO DISTURB MATTER · RIGHT-CLICK TO FLAG · FIND 10 MINES<br>MINES INCLUDE TAX GOBLINS, SENTIENT YOGURT AND ONE VERY SMALL BLACK HOLE.</footer>
</main>
<script>
(function(){
'use strict';
var S=9,T=81,M=10,board=document.getElementById('board'),message=document.getElementById('message'),bombs=document.getElementById('bombs'),scoreOut=document.getElementById('score'),timeOut=document.getElementById('time'),flagButton=document.getElementById('flagmode');
var cells=[],over=false,flagMode=false,flags=0,opened=0,score=0,seconds=0,first=true,timer=null;
var weird=['A TAX GOBLIN HAS AUDITED YOUR SOUL.','A SHRIMP KNOWS WHAT YOU DID IN 2007.','THE MOON DENIES ALL RESPONSIBILITY.','THE YOGURT HAS ACQUIRED DIPLOMATIC IMMUNITY.','YOUR SHADOW IS NOW A MIDDLE MANAGER.','THE VOID REQUESTS YOUR POSTCODE.','A TINY BLACK HOLE OWES YOU €3.50.','FOURTEEN GHOSTS HAVE UNIONISED.','AN INVISIBLE HORSE FILED AN APPEAL.','THE COSMIC OCTOPUS REJECTED YOUR FORM.','YOUR EXISTENCE HAS BEEN RECLASSIFIED AS SOUP.','A POTATO HAS BEEN APPOINTED SUPREME COURT.'];
var symbols=['🦐','🧾','🛸','🪱','🥛','🧿','🦷','🧌','🫀','🪤'];
function say(t){message.textContent=t}
function rand(n){return Math.floor(Math.random()*n)}
function around(i){var out=[],x=i%S,y=Math.floor(i/S);for(var dy=-1;dy<=1;dy++)for(var dx=-1;dx<=1;dx++){var xx=x+dx,yy=y+dy;if((dx||dy)&&xx>=0&&xx<S&&yy>=0&&yy<S)out.push(yy*S+xx)}return out}
function count(i){return around(i).filter(function(j){return cells[j].mine}).length}
function update(){bombs.textContent=String(Math.max(0,M-flags)).padStart(3,'0');scoreOut.textContent=String(score).padStart(4,'0');timeOut.textContent=seconds+' SEC'}
function paint(i){var c=cells[i],b=c.el;b.className='tile';b.textContent='';if(c.flag){b.classList.add('flag');b.textContent='⚑';b.setAttribute('aria-label','Flagged tile');return}if(!c.open){b.setAttribute('aria-label','Hidden tile');return}b.classList.add('open');if(c.mine){b.classList.add('mine');b.textContent=symbols[(i*7)%symbols.length];b.setAttribute('aria-label','Mine');return}var n=count(i);if(n){b.textContent=n;b.classList.add('n'+n);b.setAttribute('aria-label',n+' nearby mines')}else b.setAttribute('aria-label','Empty tile')}
function stop(win,hit){over=true;if(timer!==null){clearInterval(timer);timer=null}if(win){score+=1000;say('YOU SURVIVED THE COSMIC AUDIT. +1000 EXISTENCE CREDITS.')}else{say('YOU DETONATED A '+symbols[(hit*7)%symbols.length]+'. REALITY DENIES YOUR CLAIM.')}update()}
function revealSafe(i){if(over||cells[i].open||cells[i].flag||cells[i].mine)return;cells[i].open=true;opened++;score+=7;paint(i);if(count(i)===0)around(i).forEach(revealSafe)}
function reveal(i){if(over||cells[i].open||cells[i].flag)return;if(first){first=false;if(cells[i].mine){cells[i].mine=false;var safe=rand(T);while(cells[safe].mine||safe===i)safe=rand(T);cells[safe].mine=true}}if(timer===null)timer=setInterval(function(){if(!over){seconds++;update()}},1000);var c=cells[i];c.open=true;opened++;score+=7;paint(i);if(c.mine){cells.forEach(function(v,j){if(v.mine){v.open=true;paint(j)}});stop(false,i);return}if(count(i)===0)around(i).forEach(revealSafe);if(Math.random()<.18)say(weird[rand(weird.length)]);else say(['The void is statistically concerned.','A number has appeared. Lawyers are en route.','Your survival is provisionally recognised.','The stars misplaced the instructions.','One square closer to cosmic insolvency.'][rand(5)]);if(opened===T-M)stop(true,i);update()}
function toggleFlag(i){if(over||cells[i].open)return;cells[i].flag=!cells[i].flag;flags+=cells[i].flag?1:-1;paint(i);update();say(cells[i].flag?'Flag submitted. The bureaucracy is pleased.':'Flag withdrawn. Your paperwork is incomplete.')}
function reset(){if(timer!==null){clearInterval(timer);timer=null}cells=Array.from({length:T},function(){return{open:false,flag:false,mine:false,el:null}});over=false;flagMode=false;flags=opened=score=seconds=0;first=true;flagButton.setAttribute('aria-pressed','false');flagButton.textContent='FLAG MODE: OFF';board.innerHTML='';for(var i=0;i<T;i++){(function(i){var b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label','Hidden tile');cells[i].el=b;board.appendChild(b);b.addEventListener('click',function(){if(flagMode)toggleFlag(i);else reveal(i)});b.addEventListener('contextmenu',function(e){e.preventDefault();toggleFlag(i)})})(i)}var placed=0;while(placed<M){var j=rand(T);if(!cells[j].mine){cells[j].mine=true;placed++}}say('Your application to exist is pending.');update()}
flagButton.addEventListener('click',function(){flagMode=!flagMode;flagButton.setAttribute('aria-pressed',String(flagMode));flagButton.textContent='FLAG MODE: '+(flagMode?'ON':'OFF');say(flagMode?'Tap tiles to flag them. The tribunal is watching.':'Tap tiles to reveal their secrets.')});document.getElementById('restart').addEventListener('click',reset);document.getElementById('weird').addEventListener('click',function(){say(weird[rand(weird.length)]);if(!over){var hidden=cells.filter(function(c){return !c.open&&!c.flag});if(hidden.length&&Math.random()<.5){var c=hidden[rand(hidden.length)];c.el.style.borderColor='#ff4fb3';c.el.textContent='¿';setTimeout(function(){if(!c.open&&!c.flag)c.el.textContent=''},650)}}});reset();
})();
</script>
</body>
</html>
