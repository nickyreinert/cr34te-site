<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header class="bar">
    <button id="play" type="button">Play</button>
    <label>Tempo <input id="bpm" type="range" min="50" max="200" step="1" value="90"> <output id="bpmOut">90</output></label>
    <button id="wav" type="button">WAV speichern</button>
  </header>
  <section class="bar">
    <span>Pattern</span>
    <span id="tabs" class="bar"></span>
    <button id="addPat" type="button" title="Pattern hinzufügen">+</button>
    <button id="delPat" type="button" title="Aktuelles Pattern löschen">&minus;</button>
  </section>
  <section class="bar">
    <label>Vorlage <select id="preset"></select></label>
    <button id="load" type="button">Laden</button>
    <label>Akkord <select id="chord"></select></label>
    <label>Bass <select id="bassNote"></select></label>
  </section>
  <section id="grid"></section>
</main>
<script src="script.js"></script>
</body>
</html>
