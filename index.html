<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mona Lisa Louvre Heist - Pixel Art Edition</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app-container">
    <div class="louvre-wall">
      <div class="wall-paper"></div>
      <div class="wall-dado"></div>
      <div class="stanchion-rope"></div>
      
      <div class="pixel-frame" id="paintingFrame">
        <canvas id="monaCanvas" width="120" height="160"></canvas>
        <canvas id="geishaCanvas" width="120" height="160" style="display:none;"></canvas>
        <div id="noseHotspot" title="Klicke auf die Nase!"></div>
      </div>
    </div>

    <div class="actors-container">
      <div class="pixel-actor robber robber-1" id="robber1">
        <div class="speech-bubble">Hehehe! 🤭</div>
      </div>
      <div class="pixel-actor robber robber-2" id="robber2"></div>

      <div class="pixel-actor man grandpa" id="grandpa"></div>
      <div class="pixel-actor man son" id="son">
        <div class="speech-bubble">Banzai! 😄</div>
      </div>
    </div>

    <div id="hintOverlay" class="hint-overlay">Tippe der Mona Lisa auf die Nase! 👃</div>
    <button id="replayBtn" class="replay-btn">REPLAY 🔄</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
