<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale of the Universe</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <div id="stage"><canvas id="view"></canvas></div>
  <section id="info">
    <h1 id="name"></h1>
    <p id="size"></p>
    <p class="rel" id="rel1"></p>
    <p class="rel" id="rel2"></p>
  </section>
  <div id="controls">
    <button id="smaller" type="button">&#9664; Smaller</button>
    <input id="zoom" type="range" aria-label="Zoom level (logarithmic)">
    <button id="larger" type="button">Larger &#9654;</button>
  </div>
  <div id="chips"></div>
</main>
<script src="script.js"></script>
</body>
</html>
