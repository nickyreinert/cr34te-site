<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Bar Boss</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<header id="top">
<div class="kpi"><small id="tDay">Tag 1</small><b id="tPhase">Morgen</b></div>
<div class="kpi"><small id="tWeatherL">Wetter</small><b id="tWeather">–</b></div>
<div class="kpi"><small>Kasse</small><b id="tCash" class="money">$0</b></div>
<div class="kpi"><small id="tRatingL">Ruf</small><b id="tRating" class="stars"></b></div>
<div class="kpi hide-s"><small>Stufe</small><b id="tStage">Strandbude</b></div>
<div class="ctl"><button type="button" id="pauseBtn" title="Pause (Leertaste)">❚❚</button><button type="button" id="speedBtn" title="Tempo">1×</button></div>
</header>
<div id="sceneWrap"><canvas id="scene" width="320" height="150" aria-label="Die Strandbar"></canvas></div>
<nav id="phases"></nav>
<div id="tabs" role="tablist"></div>
<main id="main">
<section id="left" class="pane"></section>
<section id="right" class="pane"></section>
</main>
<div id="modal" hidden>
<div class="win" role="dialog" aria-modal="true" aria-labelledby="mTitle">
<div class="whead"><span id="mTitle"></span></div>
<div id="mBody"></div>
</div>
</div>
</div>
<script src="assets/sim.js"></script>
<script src="assets/art.js"></script>
<script src="script.js"></script>
</body>
</html>
