<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Causeway Countdown</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <canvas id="scene" aria-label="A car driving over a bridge towards a city skyline at sunset"></canvas>

  <div id="hud">
    <div id="label">GTA VI &middot; 19 November 2026</div>
    <div id="clock" role="timer" aria-live="off">
      <div class="unit"><span id="cd">--</span><small>days</small></div>
      <div class="sep">:</div>
      <div class="unit"><span id="ch">--</span><small>hours</small></div>
      <div class="sep">:</div>
      <div class="unit"><span id="cm">--</span><small>minutes</small></div>
      <div class="sep">:</div>
      <div class="unit"><span id="cs">--</span><small>seconds</small></div>
    </div>
    <div id="done" hidden>Out now</div>
    <div id="note">counting down to midnight, your local time</div>
  </div>

  <div id="msg" hidden>Crash! Starting over</div>
  <div id="hint">Click or tap to drive<small>Steer with &larr; &rarr; or A D, or hold the left or right side. Dodge the slower cars.</small></div>
  <div class="arrow" id="aL" aria-hidden="true">&#9664;</div>
  <div class="arrow" id="aR" aria-hidden="true">&#9654;</div>
  <div id="bottom">
    <div id="score">0.00 km</div>
    <button id="snd" type="button" aria-pressed="false">Music: off</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
