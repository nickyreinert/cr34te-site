<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pip's Endless Run</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Pip's Endless Run - a procedural jump and run game"></canvas>
<div id="pad" aria-hidden="true">
  <div class="grp">
    <button type="button" data-k="left">&#9664;</button>
    <button type="button" data-k="right">&#9654;</button>
  </div>
  <div class="grp">
    <button type="button" data-k="dash" id="dashBtn">Lv5</button>
    <button type="button" data-k="jump" class="big">JUMP</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
