<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lichtjahre</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
<canvas id="cv" aria-label="Spielansicht"></canvas>
<div id="hud" hidden>
<div id="meters"></div>
<div id="info"></div>
</div>
<div id="mapbar" hidden>
<button type="button" data-a="mapGal">Galaxie</button>
<button type="button" data-a="mapSys">System</button>
<button type="button" data-a="mapClose" aria-label="Karte schließen">Schließen</button>
</div>
<div id="sheet" hidden></div>
<div id="ctl" hidden>
<div id="joy" aria-hidden="true"><i></i></div>
<div id="btns">
<button type="button" id="bAlt">Schub</button>
<button type="button" id="bAct">Aktion</button>
</div>
<button type="button" id="bMenu" aria-label="Menü">Menü<span id="badge" hidden></span></button>
</div>
<div id="hint" hidden></div>
<div id="toasts"></div>
<div id="panel" hidden>
<div class="ph"><nav id="tabs"></nav><button type="button" class="x" data-a="closePanel" aria-label="Schließen">&times;</button></div>
<div id="pbody"></div>
</div>
<div id="modal" hidden><div class="letter" id="letter"></div></div>
<div id="title"></div>
</div>
<script src="assets/world.js"></script>
<script src="assets/sound.js"></script>
<script src="assets/space.js"></script>
<script src="assets/planet.js"></script>
<script src="assets/ending.js"></script>
<script src="script.js"></script>
</body>
</html>
