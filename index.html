<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C64 BASIC V2 Simulator</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="machine" aria-label="Commodore 64 BASIC simulator">
  <header><span class="led"></span><span>COMMODORE 64</span><span class="version">BASIC V2</span></header>
  <section id="screen" class="screen" aria-label="BASIC terminal" aria-live="polite">
    <div id="output" class="output"></div>
    <div class="inputline"><span id="prompt">READY.</span><input id="command" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="BASIC command"><span class="cursor"></span></div>
  </section>
  <footer><div class="status"><span id="state">READY</span><span id="memory">38911 BASIC BYTES FREE</span></div><div class="help">Enter a command · F1 LIST · F3 RUN · F5 NEW · ↑ history</div></footer>
</main>
<script src="script.js"></script>
</body>
</html>
