<!doctype html>
<html lang="en" style="background:#151515;color-scheme:dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Legend Pixel Puzzle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="game" aria-label="Legend puzzle">
  <header><h1>LEGEND</h1><p class="status" role="status"></p></header>
  <p class="instructions">Drag or tap two tiles to swap. Use arrows and Enter for keyboard play.</p>
  <div class="stage">
    <div class="board" role="group" aria-label="Six by six puzzle"></div>
    <canvas class="reference" aria-hidden="true" hidden></canvas>
    <div class="victory" aria-hidden="true" hidden>
      <div class="dog-track"><div class="dog">
        <canvas class="dog-body"></canvas>
        <canvas class="dog-back"></canvas>
        <canvas class="dog-front"></canvas>
      </div></div>
      <p class="victory-title">LEGEND!</p>
    </div>
  </div>
  <div class="controls">
    <button class="shuffle" type="button" disabled>Shuffle</button>
    <button class="hint" type="button" aria-pressed="false" disabled>Hint</button>
  </div>
</main>
<script src="assets/pixels.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
